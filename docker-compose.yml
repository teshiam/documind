services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach a local Ollama
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
